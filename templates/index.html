<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand fw-semibold" href="{{ url_for('index') }}">Nexus</a>
            <div class="ms-auto">
                {% if current_user.is_authenticated %}
                    <a class="nav-link" href="{{ url_for('chat_redirect') }}">Чат</a>
                {% else %}
                    <a class="nav-link" href="{{ url_for('login') }}">Войти</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="hero-section">
        <h1 class="greeting">
            <span class="nexus-gradient-text">Привет. Я Nexus.</span><br>
            Чем могу помочь?
        </h1>
        <p class="subtitle">
            Современная нейросеть для решения ваших задач. Локальная обработка и конфиденциальность.
        </p>
        {% if current_user.is_authenticated %}
            <a href="{{ url_for('chat_redirect') }}" class="btn-nexus">Перейти в чат</a>
        {% else %}
            <a href="{{ url_for('register') }}" class="btn-nexus">Начать</a>
        {% endif %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
