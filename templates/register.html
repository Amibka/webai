<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Nexus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #131314;
            color: #e3e3e3;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nexus-panel {
            background: #1e1f20;
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .nexus-gradient-text {
            background: linear-gradient(74deg, #4285f4 0%, #9b72cb 46%, #d96570 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }
        .form-control {
            background-color: #131314;
            border: 1px solid #444746;
            color: #e3e3e3;
            border-radius: 12px;
            padding: 12px 16px;
            transition: border-color 0.2s;
        }
        .form-control:focus {
            background-color: #131314;
            border-color: #a8c7fa;
            color: #e3e3e3;
            box-shadow: none;
        }
        .btn-nexus {
            background-color: #c4c7c5;
            color: #131314;
            border: none;
            padding: 12px;
            border-radius: 24px;
            font-weight: 500;
            width: 100%;
            transition: background-color 0.2s ease;
        }
        .btn-nexus:hover {
            background-color: #e3e3e3;
        }
        a {
            color: #a8c7fa;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .form-control::placeholder {
            color: #ffffff;
            opacity: 1;
        }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center">
    <div class="nexus-panel">
        <h2 class="mb-4 text-center fw-semibold"><span class="nexus-gradient-text">Регистрация</span></h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} text-white rounded-3 mb-3 p-2 text-center"
             style="background-color: #b3261e !important; border: none;">{{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}
        <form method="POST">
            <div class="mb-3">
                <input type="text" name="username" class="form-control" placeholder="Имя пользователя" required>
            </div>
            <div class="mb-5">
                <input type="password" name="password" class="form-control" placeholder="Пароль" required>
            </div>
            <button type="submit" class="btn-nexus">Создать аккаунт</button>
            <div class="mt-4 text-center">
                <span class="text-secondary">Уже есть аккаунт?</span> <a href="{{ url_for('login') }}"
                                                                         style="color: #ffffff;">Войти</a>
            </div>
        </form>
    </div>
</div>
</body>
<div style="position: absolute; top: 24px; left: 24px;">
    <a href="{{ url_for('index') }}"
       style="
            display: flex;
            align-items: center;
            gap: 8px;

            color: #ffffff;
            text-decoration: none;

            font-size: 0.95rem;
            font-weight: 500;
       ">

        <svg xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 24 24"
             width="20"
             height="20"
             fill="currentColor">

            <path d="M19 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H19v-2z"/>
        </svg>

        Назад
    </a>
</div>
</html>
